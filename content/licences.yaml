# Which licences the catalogue may use, and what each one obliges us to do.
#
# ADR-11 admitted attribution-licensed work alongside CC0 because Islandia is a gift that is never
# published or sold, which roughly triples the usable art. That is a decision with a record, and
# `decision` below cites it — the ledger tool checks the cited record really exists in
# DECISIONS.md, so this file cannot quietly admit a licence on nobody's authority.
#
# attribution: true means the ledger refuses an item on this licence unless it names an author and
# a source url. Attribution is honoured in the in-app notices screen, not treated as optional
# because nobody would check.
#
# non_commercial: true is admitted and recorded as such, so that if this project's purpose ever
# changes the position stays honest rather than being discovered later.
#
# Anything forbidding derivative works is refused outright: the ingest pipeline rescales, retopos,
# bakes and recolours everything it touches, so every asset in here is a derivative.

decision: "2026-11-10 — This is a gift, not a product"

allowed:
  - id: CC0-1.0
    name: Creative Commons Zero v1.0 Universal
    attribution: false
    non_commercial: false

  - id: Unlicense
    name: The Unlicense
    attribution: false
    non_commercial: false

  - id: CC-BY-3.0
    name: Creative Commons Attribution 3.0
    attribution: true
    non_commercial: false

  - id: CC-BY-4.0
    name: Creative Commons Attribution 4.0
    attribution: true
    non_commercial: false

  - id: CC-BY-SA-4.0
    name: Creative Commons Attribution-ShareAlike 4.0
    attribution: true
    non_commercial: false

  - id: CC-BY-NC-4.0
    name: Creative Commons Attribution-NonCommercial 4.0
    attribution: true
    non_commercial: true

  - id: MIT
    name: MIT
    attribution: true
    non_commercial: false

  - id: generated
    name: Generated by this project's own tooling
    attribution: false
    non_commercial: false
