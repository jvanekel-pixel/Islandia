# risk:   low | med | high      (high => independent review before merge)
# accept: each line ends with the verification level that proves it (see 04-VERIFICATION.md).
#         [L6]/[L7] criteria are recorded as needs-device / needs-human; they never block merge.
# refs:   bp = docs/blueprint/, dr = reference/drafts/, au = docs/plan/audit/, adr = 02-ARCHITECTURE.md
#
# Editing rules: 05-OPERATIONS.md §11. Split freely (W-03a, W-03b). Never delete acceptance lines
# without a DECISIONS.md entry.

