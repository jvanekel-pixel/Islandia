# Runs the project configurator and commits what it generates.
#
# Work package F-04. Deliberately dispatch-only, for the same reason as the project workflow: it
# writes to the repository, and a workflow that commits should be one a person asked for.
#
# Being dispatch-only also means it reports no check against a commit, so auto-merge never waits on
# it — which is why it is absent from auto-merge's workflow_run list, and why
# tools/lint/check_workflows.py does not require it there.
#
# The proof is not this workflow. It commits the assets; `unity-tests` then reads them back and
# asserts every ADR-03 item against what is on disk, which is what a build will load.

name: unity-configure

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Commit what the configurator generates
        type: boolean
        default: true

concurrency:
  group: unity-licence
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  configure:
    name: Apply ADR-03 and commit the result
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: unityci/editor:ubuntu-6000.3.28f1-base-3
      options: --user root

    env:
      LICENSING_CLIENT: /opt/unity/Editor/Data/Resources/Licensing/Client/Unity.Licensing.Client

    steps:
      - uses: actions/checkout@v4

      - name: Let git use this checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Take a Personal seat
        id: activate
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set +e
          output="$("$LICENSING_CLIENT" --activate-all --include-personal \
                      --username "$UNITY_EMAIL" --password "$UNITY_PASSWORD" 2>&1)"
          echo "$output" | grep -viE 'password|token'
          echo "activated=true" >> "$GITHUB_OUTPUT"
          echo "$output" | grep -q 'Activation processed successfully' || {
            echo "::error title=Unity licence failed::no seat. Run the 'Unity licence' workflow for the reason."
            exit 1
          }

      - name: Apply the configuration
        run: |
          set +e
          # ApplyAndExit sets the exit code itself, so no -quit: the method decides.
          unity-editor -batchmode -nographics -projectPath . \
            -executeMethod Island.Editor.ProjectConfigurator.ApplyAndExit \
            -logFile /tmp/configure.log
          code=$?
          echo "::group::Unity log (tail)"; tail -150 /tmp/configure.log || true; echo "::endgroup::"

          if [ "$code" -ne 0 ]; then
            echo "::error title=Configuration failed::the configurator exited $code"
            exit 1
          fi
          grep -iE 'error CS[0-9]+' /tmp/configure.log && {
            echo "::error title=Compile errors::the editor could not build the configurator"
            exit 1
          }
          echo "Configurator ran."

      - name: Show what it changed
        run: |
          git status --porcelain Assets ProjectSettings || true

      - name: Commit it
        if: ${{ inputs.commit }}
        run: |
          set -e
          git config user.name "Islandia CI"
          git config user.email "noreply@anthropic.com"
          git add Assets/Island/Generated ProjectSettings 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "Nothing to commit: the configuration already matches, which is what idempotent means."
            exit 0
          fi

          {
            printf 'F-04: the rendering configuration, generated\n\n'
            printf 'Written by Island.Editor.ProjectConfigurator, not by hand. ADR-06 forbids\n'
            printf 'hand-writing Unity YAML: a hand-made settings file opens fine and is subtly\n'
            printf 'wrong in ways that only appear on a device.\n\n'
            printf 'ProjectConfigurationTests reads these back and asserts every ADR-03 item.\n\n'
            printf 'Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>\n'
          } > /tmp/configure-message.txt

          git commit -q -F /tmp/configure-message.txt
          git push origin HEAD
          echo "Committed and pushed."

      - name: Give the seat back
        if: always() && steps.activate.outputs.activated == 'true'
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set +e
          "$LICENSING_CLIENT" --deactivate-all \
            --username "$UNITY_EMAIL" --password "$UNITY_PASSWORD" 2>&1 \
            | grep -viE 'password|token' | tail -5
          echo "Seat returned."
