# Does the Unity licence actually work in CI?
#
# Work package F-02. This is deliberately the smallest thing that can answer that question, and it
# runs on its own so a licence problem is never mistaken for a code problem. Everything else that
# needs Unity depends on this passing first.
#
# Run it by hand: Actions -> "Unity licence" -> "Run workflow".

name: Unity licence

on:
  workflow_dispatch:

concurrency:
  group: unity-licence
  cancel-in-progress: true

jobs:
  licence:
    name: Activate, then report the editor version
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      # Pinned in docs/plan/DECISIONS.md. The base image carries no Android module, which this
      # check does not need; the build workflow uses the -android- image of the same version.
      image: unityci/editor:ubuntu-6000.3.28f1-base-3
      options: --user root

    steps:
      - name: The three secrets are present
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          missing=""
          [ -n "${UNITY_LICENSE:-}" ]  || missing="$missing UNITY_LICENSE"
          [ -n "${UNITY_EMAIL:-}" ]    || missing="$missing UNITY_EMAIL"
          [ -n "${UNITY_PASSWORD:-}" ] || missing="$missing UNITY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error title=Unity secrets missing::Not set on this repository:$missing"
            echo
            echo "Add them under Settings -> Secrets and variables -> Actions -> New repository secret."
            echo "docs/plan/00-START-HERE.md section 2 step 3 has where each value comes from."
            echo "UNITY_LICENSE is the whole contents of C:\\ProgramData\\Unity\\Unity_lic.ulf."
            echo "UNITY_PASSWORD needs a real Unity password; a Google-only account has none until"
            echo "one is set through the password reset at https://login.unity.com."
            exit 1
          fi
          # Values are never printed. Length alone tells us a paste was not truncated.
          echo "All three secrets are set. UNITY_LICENSE is ${#UNITY_LICENSE} characters."
          case "$UNITY_LICENSE" in
            *"<License"*) echo "It looks like a .ulf licence file." ;;
            *) echo "::warning title=Unexpected licence contents::UNITY_LICENSE does not contain '<License'. Did the whole .ulf file get pasted?" ;;
          esac

      - name: What licensing tooling does this image have
        run: |
          echo "::group::Licensing client"
          find /opt/unity -iname '*Licensing*' -maxdepth 6 2>/dev/null | head -20 || true
          echo "::endgroup::"
          echo "::group::unity-editor -help, licence flags only"
          unity-editor -help 2>&1 | grep -iE 'licen[cs]e|serial|manual' | head -20 || true
          echo "::endgroup::"

      - name: Try each way of applying the licence, and say which works
        id: probe
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set +e
          install -d /root/.local/share/unity3d/Unity
          printf '%s' "$UNITY_LICENSE" > /tmp/Unity_lic.ulf
          cp /tmp/Unity_lic.ulf /root/.local/share/unity3d/Unity/Unity_lic.ulf

          worked=""

          # A: the licensing client imports the file. This is what Unity 6 expects; simply
          #    placing the file is the 2019-era method and is what failed.
          client="$(find /opt/unity -name 'Unity.Licensing.Client' -type f 2>/dev/null | head -1)"
          if [ -n "$client" ]; then
            echo "::group::A. Unity.Licensing.Client --import"
            "$client" --import /tmp/Unity_lic.ulf 2>&1 | tail -20
            echo "exit $?"
            echo "::endgroup::"
            unity-editor -batchmode -nographics -quit -createProject /tmp/probe-a -logFile /tmp/a.log
            [ $? -eq 0 ] && worked="A: licensing client import"
          else
            echo "A. skipped: no Unity.Licensing.Client in this image"
          fi

          # B: the editor's own flag for applying a .ulf.
          if [ -z "$worked" ]; then
            echo "::group::B. -manualLicenseFile"
            unity-editor -batchmode -nographics -quit \
              -manualLicenseFile /tmp/Unity_lic.ulf -logFile /tmp/b.log 2>&1 | tail -5
            tail -25 /tmp/b.log 2>/dev/null
            echo "::endgroup::"
            unity-editor -batchmode -nographics -quit -createProject /tmp/probe-b -logFile /tmp/b2.log
            [ $? -eq 0 ] && worked="B: -manualLicenseFile"
          fi

          # C: sign in with the account, which is the path GameCI uses for serials.
          if [ -z "$worked" ]; then
            echo "::group::C. -username/-password sign-in"
            unity-editor -batchmode -nographics -quit \
              -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD" \
              -logFile /tmp/c.log 2>&1 | tail -5
            tail -25 /tmp/c.log 2>/dev/null
            echo "::endgroup::"
            unity-editor -batchmode -nographics -quit -createProject /tmp/probe-c -logFile /tmp/c2.log
            [ $? -eq 0 ] && worked="C: account sign-in"
          fi

          echo "worked=$worked" >> "$GITHUB_OUTPUT"
          echo "=============================================="
          if [ -n "$worked" ]; then echo "ACTIVATION METHOD THAT WORKS -> $worked"
          else echo "NONE of A, B or C produced a usable licence"; fi
          echo "=============================================="

          # Whichever got furthest, surface the entitlement lines: they say whether the account
          # is the problem rather than the method.
          echo "::group::entitlement and licence lines from every attempt"
          grep -hiE 'entitlement|licen[cs]e|serial|Machine binding' /tmp/a.log /tmp/b.log /tmp/b2.log /tmp/c.log /tmp/c2.log 2>/dev/null | sort -u | head -40
          echo "::endgroup::"
          exit 0

      - name: Say what happened
        run: |
          log=/tmp/unity.log
          status="${{ steps.probe.outputs.exit-code }}"

          version="$(grep -m1 -oE 'Version is .[0-9]+\.[0-9]+\.[0-9]+[a-z0-9]*' "$log" 2>/dev/null | sed 's/Version is .//')"
          [ -n "$version" ] || version="$(unity-editor -version 2>/dev/null | head -1)"

          if [ "$status" = "0" ] && [ -d /tmp/licence-probe ]; then
            echo "## Unity licence works" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Editor version: \`${version:-unknown}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "Image: \`unityci/editor:ubuntu-6000.3.28f1-base-3\`" >> "$GITHUB_STEP_SUMMARY"
            echo "Editor version: ${version:-unknown}"
            exit 0
          fi

          # Name the cause rather than make someone read a 2,000-line Unity log.
          cause="the editor exited $status"
          if   grep -qi 'License has expired\|license is not valid\|Licence expired' "$log" 2>/dev/null; then
            cause="the licence has expired — re-issue it in Unity Hub and update UNITY_LICENSE"
          elif grep -qi 'No valid Unity Editor license\|Unable to find a valid license\|LICENSE SYSTEM.*FAILED' "$log" 2>/dev/null; then
            cause="Unity did not accept the licence file — check UNITY_LICENSE holds the entire .ulf, including the closing tag"
          elif grep -qi 'two.factor\|2FA\|verification code' "$log" 2>/dev/null; then
            cause="the account wants a two-factor code, which CI cannot answer — a licence file avoids the sign-in path, so make sure UNITY_LICENSE is set"
          elif grep -qi 'Invalid credentials\|wrong password\|Unauthorized' "$log" 2>/dev/null; then
            cause="the account credentials were rejected — set a real Unity password at https://login.unity.com (a Google-only account has none)"
          fi

          echo "## Unity licence failed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Cause: $cause" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The full editor log is in the previous step, under \"Unity log\"." >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Unity licence failed::$cause"
          exit 1
