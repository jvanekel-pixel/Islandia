# Does the Unity licence work in CI?
#
# Work package F-02. Deliberately the smallest thing that can answer that, and on its own so a
# licence problem is never mistaken for a code problem. Everything else needing Unity depends on
# this passing.
#
# Run it by hand: Actions -> "Unity licence" -> "Run workflow".
#
# How this works, and why it is not what most guides say
# ------------------------------------------------------
# Older guides (and GameCI's own, in places) tell you to activate a Personal licence in Unity Hub,
# paste the resulting .ulf into a UNITY_LICENSE secret, and drop that file into place in the
# container. For Unity 6 that cannot work, and we proved both halves of it on 2026-11-10:
#
#   * a .ulf from Unity Hub is bound to the machine that made it, so the editor rejects it with
#     "[Licensing::Client] Error: Code 400 ... Machine bindings don't match", and
#   * Unity no longer supports manual activation of Personal licences at all, so the old
#     .alf-upload route that would have produced a container-bound file is closed too.
#
# What does work is asking Unity's licensing service for a seat with the account's own
# credentials. No licence file is involved, so UNITY_LICENSE is not needed.
#
# The seat must be given back
# ---------------------------
# Each activation assigns one of the account's few Personal seats to that runner, and the runner
# is destroyed minutes later. Leak them and every later run fails for want of a seat, with an
# error that looks nothing like its cause. The release step therefore runs even when the job
# fails or is cancelled.

name: Unity licence

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      editor-version:
        description: The editor version that reported itself after activation.
        value: ${{ jobs.licence.outputs.editor-version }}

concurrency:
  # Two runs activating at once would take two of the account's handful of seats.
  group: unity-licence
  cancel-in-progress: false

jobs:
  licence:
    name: Activate, then report the editor version
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      editor-version: ${{ steps.report.outputs.editor-version }}
    container:
      # Pinned in docs/plan/DECISIONS.md. The base image has no Android module, which this check
      # does not need; the build workflow uses the -android- image of the same version.
      image: unityci/editor:ubuntu-6000.3.28f1-base-3
      options: --user root

    env:
      LICENSING_CLIENT: /opt/unity/Editor/Data/Resources/Licensing/Client/Unity.Licensing.Client

    steps:
      - name: The credentials are present
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          missing=""
          [ -n "${UNITY_EMAIL:-}" ]    || missing="$missing UNITY_EMAIL"
          [ -n "${UNITY_PASSWORD:-}" ] || missing="$missing UNITY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error title=Unity credentials missing::Not set on this repository:$missing"
            echo
            echo "Add them under Settings -> Secrets and variables -> Actions."
            echo "A UNITY_LICENSE secret is NOT needed and is not read by this workflow."
            echo "An account that signs in with Google has no password until one is set"
            echo "through the password reset at https://login.unity.com."
            exit 1
          fi
          echo "Both credentials are set."

      - name: Take a Personal seat
        id: activate
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set +e
          # --include-personal falls back to Personal when the account has no paid seat assigned.
          output="$("$LICENSING_CLIENT" --activate-all --include-personal \
                      --username "$UNITY_EMAIL" --password "$UNITY_PASSWORD" 2>&1)"
          status=$?
          # The output names the seat but carries no credential; it is safe to show, and it is
          # the first thing worth reading when this fails.
          echo "$output" | grep -viE 'password|token'
          echo "activated=true" >> "$GITHUB_OUTPUT"

          if [ $status -ne 0 ] || ! echo "$output" | grep -q 'ASSIGN_SEAT'; then
            cause="the licensing service did not assign a seat"
            if   echo "$output" | grep -qi 'invalid.*credential\|unauthorized\|401'; then
              cause="the account credentials were rejected. An account that signs in with Google has no password until one is set at https://login.unity.com"
            elif echo "$output" | grep -qi 'two.factor\|2FA\|verification code'; then
              cause="the account asks for a two-factor code, which CI cannot answer"
            elif echo "$output" | grep -qi 'no seat\|seat.*unavailable\|exhausted'; then
              cause="no Personal seat was free. A previous run may have failed to give its seat back; seats free themselves after a while, so try again shortly"
            fi
            echo "## Unity licence failed" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Cause: $cause" >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Unity licence failed::$cause"
            exit 1
          fi
          echo "Seat assigned."

      - name: Open the editor on a throwaway project
        id: report
        run: |
          set +e
          # The cheapest operation that genuinely needs a licence: the editor has to start,
          # licence itself and write a project.
          unity-editor -batchmode -nographics -quit \
            -createProject /tmp/licence-probe -logFile /tmp/unity.log
          status=$?
          set -e

          version="$(grep -m1 -oE 'Version is .[0-9]+\.[0-9]+\.[0-9]+[a-z0-9]*' /tmp/unity.log \
                     | sed 's/Version is .//')"
          echo "editor-version=${version:-unknown}" >> "$GITHUB_OUTPUT"

          if [ "$status" -eq 0 ] && [ -d /tmp/licence-probe ]; then
            {
              echo "## Unity licence works"
              echo ""
              echo "| | |"
              echo "| :-- | :-- |"
              echo "| Editor | \`${version:-unknown}\` |"
              echo "| Image | \`unityci/editor:ubuntu-6000.3.28f1-base-3\` |"
              echo "| Activation | Personal seat from Unity's licensing service |"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Editor version: ${version:-unknown}"
            exit 0
          fi

          echo "::group::Unity log"
          cat /tmp/unity.log || true
          echo "::endgroup::"
          echo "::error title=Unity licence failed::a seat was assigned but the editor still would not start (exit $status)"
          exit 1

      - name: Give the seat back
        # Always. A leaked seat is one fewer for every later run, and the failure it eventually
        # causes looks nothing like its cause.
        if: always() && steps.activate.outputs.activated == 'true'
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set +e
          "$LICENSING_CLIENT" --deactivate-all \
            --username "$UNITY_EMAIL" --password "$UNITY_PASSWORD" 2>&1 \
            | grep -viE 'password|token' | tail -10
          echo "Seat returned (exit $?)."
