# Merges finished work once its checks are green.
#
# Added at the owner's explicit request (docs/plan/DECISIONS.md, 2026-11-10) so that a build
# driven by scheduled sessions does not stop every few hours waiting for someone to click a
# button. It removes a real safety net — a human looking at each change before it reaches main —
# and that trade was made knowingly.
#
# What still has to hold before anything merges:
#
#   * the pull request carries the `awaiting-merge` label, which only a finished package gets;
#   * at least one check ran on the head commit and every one of them succeeded, with none still
#     running — an empty set of checks is a refusal, not a pass;
#   * the branch is in THIS repository, never a fork;
#   * the author is the repository owner;
#   * it is not a draft, and carries none of the stop labels.
#
# The fork rule is the one that matters. This repository is public: anyone may open a pull
# request, and without that check a stranger could land code on main by adding a label. GitHub
# gives a fork's workflow a read-only token, so this could not merge for them anyway, but a
# control that depends on a token scope is not a control — it is a coincidence. So it is checked.

name: Auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, ready_for_review]
  # `workflow_run` rather than `check_suite`, and this is not a style choice. GitHub does not
  # start a new workflow run from an event created with GITHUB_TOKEN, which is what the `checks`
  # workflow's own check suite is — so `check_suite: completed` never fired for it and the
  # "a later event will come back to this" below was simply untrue. The first pull request to
  # reach `main` with checks on it (#22) skipped at "2 still running" and then sat there, waiting
  # for an event that was never coming; only the hourly backstop would have rescued it, up to an
  # hour late. `workflow_run` is the documented way to chain one workflow to another and does fire
  # in this case. `check_suite` is kept for checks from GitHub Apps, which do trigger runs.
  workflow_run:
    # Every workflow that reports a check has to be named here, or auto-merge skips while it runs
    # and nothing wakes it when it finishes. `tools/lint/check_workflows.py` enforces that, because
    # the omission is silent: adding a workflow gives no hint that a different one needs editing.
    # It has already cost two hours of pull requests sitting green — once for relying on
    # `check_suite` at all, then again when `unity-tests` was added and not listed.
    workflows: ["checks", "content", "unity-tests", "android-build", "unity-package-sources", "unity-configure", "Unity licence", "Signing key"]
    types: [completed]
  check_suite:
    types: [completed]
  workflow_dispatch:
  schedule:
    # A backstop, in case an event is missed. Nothing should normally wait this long — and when
    # something did, this is what found it rather than anyone noticing.
    - cron: '23 * * * *'

permissions:
  contents: write
  pull-requests: write
  # Only to dispatch android-build after a merge (F-14 fixing F-07): a merge made with this token
  # starts no push-triggered workflow, but a workflow_dispatch it sends does.
  actions: write

concurrency:
  group: auto-merge
  cancel-in-progress: false

jobs:
  merge:
    name: Merge what is finished and green
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Consider every labelled pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          merged=0
          skipped=0

          # Stop labels. Any one of these means a human wanted this left alone.
          blocked_labels='blocked|needs-human|do-not-merge|wip'

          numbers="$(gh api "repos/$REPO/pulls?state=open&per_page=100" \
            --jq '.[] | select(.labels | map(.name) | index("awaiting-merge")) | .number')"

          if [ -z "$numbers" ]; then
            echo "Nothing is labelled awaiting-merge."
            exit 0
          fi

          for number in $numbers; do
            pr="$(gh api "repos/$REPO/pulls/$number")"
            title="$(echo "$pr"     | jq -r '.title')"
            head_repo="$(echo "$pr" | jq -r '.head.repo.full_name')"
            head_sha="$(echo "$pr"  | jq -r '.head.sha')"
            author="$(echo "$pr"    | jq -r '.user.login')"
            draft="$(echo "$pr"     | jq -r '.draft')"
            mergeable="$(echo "$pr" | jq -r '.mergeable_state')"
            labels="$(echo "$pr"    | jq -r '.labels[].name' | tr '\n' ' ')"

            echo "::group::#$number $title"
            echo "head: $head_repo @ ${head_sha:0:8} | author: $author | state: $mergeable"
            echo "labels: $labels"

            # --- the guards ----------------------------------------------------------------

            if [ "$head_repo" != "$REPO" ]; then
              echo "SKIP: the branch lives in $head_repo, not this repository. Fork pull requests are never merged automatically."
              skipped=$((skipped + 1)); echo "::endgroup::"; continue
            fi

            if [ "$author" != "$OWNER" ]; then
              echo "SKIP: opened by $author, who is not the repository owner."
              skipped=$((skipped + 1)); echo "::endgroup::"; continue
            fi

            if [ "$draft" = "true" ]; then
              echo "SKIP: still a draft."
              skipped=$((skipped + 1)); echo "::endgroup::"; continue
            fi

            if echo "$labels" | grep -qE "$blocked_labels"; then
              echo "SKIP: carries a stop label."
              skipped=$((skipped + 1)); echo "::endgroup::"; continue
            fi

            # --- the checks ----------------------------------------------------------------

            runs="$(gh api "repos/$REPO/commits/$head_sha/check-runs" --jq '.check_runs')"
            total="$(echo "$runs" | jq 'length')"
            # This workflow checks itself; ignore its own run or it would wait on itself forever.
            pending="$(echo "$runs" | jq '[.[] | select(.name | test("Merge what is finished") | not)
                                              | select(.status != "completed")] | length')"
            failed="$(echo "$runs"  | jq -r '[.[] | select(.name | test("Merge what is finished") | not)
                                              | select(.conclusion != null and
                                                       (.conclusion | IN("success","neutral","skipped") | not))
                                              | .name] | join(", ")')"

            statuses="$(gh api "repos/$REPO/commits/$head_sha/status" --jq '.state')"

            echo "checks: $total total, $pending still running; commit status: $statuses"

            if [ "$pending" -gt 0 ]; then
              echo "SKIP: checks are still running. The checks workflow finishing will bring us"
              echo "      back here through workflow_run; the hourly schedule is the backstop."
              skipped=$((skipped + 1)); echo "::endgroup::"; continue
            fi

            if [ -n "$failed" ]; then
              echo "SKIP: these checks did not pass: $failed"
              skipped=$((skipped + 1)); echo "::endgroup::"; continue
            fi

            # A commit nothing has checked is not a commit whose checks passed. Every guard above
            # is vacuously true on a commit with no check runs, so without this the label alone
            # merges the code. That is not hypothetical: on 2026-11-10 this workflow merged four
            # pull requests that no CI had touched, because it landed before the `checks` workflow
            # existed and "all checks passed" was true of an empty set.
            succeeded="$(echo "$runs" | jq '[.[] | select(.name | test("Merge what is finished") | not)
                                              | select(.conclusion == "success")] | length')"
            if [ "$succeeded" -eq 0 ]; then
              echo "SKIP: nothing has verified ${head_sha:0:8}. No check succeeded on it, so there"
              echo "      is no evidence to merge on. Expected the 'checks' workflow"
              echo "      (.github/workflows/checks.yml) to run on every push; if it is not"
              echo "      running on this branch, that is the thing to fix."
              skipped=$((skipped + 1)); echo "::endgroup::"; continue
            fi

            if [ "$statuses" = "failure" ] || [ "$statuses" = "error" ]; then
              echo "SKIP: the commit status is $statuses."
              skipped=$((skipped + 1)); echo "::endgroup::"; continue
            fi

            if [ "$mergeable" = "dirty" ] || [ "$mergeable" = "blocked" ]; then
              echo "SKIP: GitHub reports the branch as '$mergeable' — probably a conflict."
              skipped=$((skipped + 1)); echo "::endgroup::"; continue
            fi

            # --- merge -----------------------------------------------------------------------

            if gh api -X PUT "repos/$REPO/pulls/$number/merge" \
                 -f merge_method=squash -f sha="$head_sha" >/dev/null 2>&1; then
              echo "MERGED"
              gh api -X POST "repos/$REPO/issues/$number/comments" \
                -f body="Merged automatically: every check on \`${head_sha:0:8}\` passed. See \`.github/workflows/auto-merge.yml\`." >/dev/null || true
              merged=$((merged + 1))

              # A squash made with GITHUB_TOKEN triggers no `push` workflow on main, so the APK
              # build that F-07 promised "on merge to main" would never run. Dispatch it instead,
              # when the merge touched the project.
              if gh api "repos/$REPO/pulls/$number/files?per_page=100" --paginate --jq '.[].filename' \
                   | grep -qE '^(Assets|Packages|ProjectSettings)/'; then
                if gh api -X POST "repos/$REPO/actions/workflows/android-build.yml/dispatches" \
                     -f ref=main >/dev/null 2>&1; then
                  echo "Dispatched android-build on main."
                else
                  echo "::warning::could not dispatch android-build on main after merging #$number"
                fi
              fi
            else
              echo "SKIP: GitHub refused the merge. It may have changed since this run started."
              skipped=$((skipped + 1))
            fi
            echo "::endgroup::"
          done

          echo "## Auto-merge" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Merged $merged, left alone $skipped." >> "$GITHUB_STEP_SUMMARY"
          echo "Merged $merged, left alone $skipped."
